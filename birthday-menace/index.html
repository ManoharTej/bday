<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project: Birthday Menace - Ammamma Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&family=Pacifico&family=Bungee+Inline&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p1: #FFD1DC; --p2: #FFB7B2; --p3: #FF85A1; --p4: #D81B60;
            --glass: rgba(255, 255, 255, 0.9); --gold: #FFD700; --ribbon-shadow: #85103a;
        }

        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Quicksand', sans-serif; background-color: var(--p4); }

        .menace-bg-stripes {
            position: fixed; inset: 0; z-index: -10;
            background: repeating-linear-gradient(45deg, var(--p1) 0, var(--p1) 80px, var(--p2) 80px, var(--p2) 160px, var(--p3) 160px, var(--p3) 240px, var(--p4) 240px, var(--p4) 320px);
        }

        .menace-glow-sweep {
            position: fixed; inset: 0; z-index: -9; pointer-events: none;
            background: linear-gradient(135deg, transparent 0%, transparent 40%, rgba(255, 255, 255, 0.45) 50%, transparent 60%, transparent 100%);
            background-size: 300% 300%; animation: sequentialGlowLogic 7s linear infinite;
        }

        @keyframes sequentialGlowLogic { 0% { background-position: 200% 200%; } 100% { background-position: -200% -200%; } }

        #game-hud { position: fixed; top: 25px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        .hud-ribbon { position: relative; background: var(--p4); color: white; padding: 10px 60px; font-family: 'Pacifico', cursive; font-size: 1.6rem; border-radius: 4px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
        .hud-ribbon::before, .hud-ribbon::after { content: ''; position: absolute; top: 8px; border: 22px solid var(--ribbon-shadow); z-index: -1; }
        .hud-ribbon::before { left: -45px; border-left-color: transparent; }
        .hud-ribbon::after { right: -45px; border-right-color: transparent; }

        #iq-box { position: fixed; top: 100px; right: 35px; background: white; padding: 10px 30px; border-radius: 35px; font-weight: 800; border: 5px solid var(--p4); color: var(--p4); font-size: 1.3rem; box-shadow: 0 8px 0px var(--p4); z-index: 1000; }

        #npc-layer { position: fixed; bottom: 0; left: 0; width: 100%; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; z-index: 100; transition: all 1s; }
        #npc-sprite-container { position: absolute; bottom: 100px; z-index: 5; }
        #main-npc { width: 220px; animation: npcFloat 4s infinite ease-in-out; }
        #dialogue-box { width: 92%; max-width: 850px; height: 130px; background: var(--glass); backdrop-filter: blur(20px); border: 6px solid white; border-bottom: none; border-radius: 45px 45px 0 0; z-index: 10; display: flex; align-items: center; justify-content: center; position: relative; }
        #npc-text { font-size: 1.25rem; color: #111; font-weight: 800; text-align: center; padding: 0 60px; line-height: 1.4; }

        .menace-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; border: 10px solid var(--p4); padding: 40px; border-radius: 50px; z-index: 5000; text-align: center; width: 90%; max-width: 550px; box-shadow: 0 0 150px rgba(0,0,0,0.5); transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-show { transform: translate(-50%, -50%) scale(1); }

        .choice-btn { background: var(--p3); color: white; border: 5px solid white; padding: 15px 45px; border-radius: 60px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin: 12px; transition: 0.3s; }
        .choice-btn:hover { transform: translateY(-5px); background: var(--p4); }
        .btn-green { background: #4CAF50; }

        .huge-penalty { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); font-family: 'Bungee Inline', cursive; font-size: 10rem; color: #ff0000; z-index: 10000; pointer-events: none; animation: popPenalty 1.3s forwards; text-shadow: 10px 10px 0px white, -3px -3px 0px white; }
        .nav-arrow { position: absolute; bottom: 35px; background: var(--p3); color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 2.2rem; cursor: pointer; display: none; z-index: 30; border: none; }
        #prev-rule { left: 45px; } #next-rule { right: 45px; }

        @keyframes popPenalty { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -95%) scale(1); opacity: 0; } }
        @keyframes npcFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px); } }
    </style>
</head>
<body>
    <div class="menace-bg-stripes"></div>
    <div class="menace-glow-sweep"></div>
    <div id="twinkle-layer"></div>

    <header id="game-hud">
        <div class="hud-ribbon">
            Task <span id="task-idx-val">00</span>/10
        </div>
        <div id="iq-box">IQ: 50</div>
    </header>

    <div id="modal-choice" class="menace-modal">
        <h1 style="font-family:'Pacifico'; color:var(--p4); margin:0;">Movie Over, Ammamma!</h1>
        <p style="font-weight:800; font-size:1.2rem; color:#444;">Are you ready to fail?</p>
        <div style="margin-top:30px;">
            <button class="choice-btn" onclick="Game.handleChoice('READ')">READ AGAIN</button>
            <button class="choice-btn btn-green" onclick="Game.handleChoice('START')">START</button>
        </div>
    </div>

    <section id="npc-layer">
        <div id="npc-sprite-container"><img src="assets/images/npc-idle.png" alt="NPC" id="main-npc"></div>
        <div id="dialogue-box">
            <button id="prev-rule" class="nav-arrow" onclick="Game.navigate(-1)">←</button>
            <p id="npc-text">Waking up the Menace... Click anywhere 🤓</p>
            <button id="next-rule" class="nav-arrow" onclick="Game.navigate(1)">→</button>
        </div>
    </section>

    <script>
        const Game = {
            state: {
                iq: 50, keys: 0, currentTask: 0,
                isRunning: false, isReReading: false,
                isMovieMode: true, ruleIdx: 0,
                typingInt: null
            },

            rules: [
                "Initializing System... Ammamma detected. 🎀",
                "Today is your birthday, but I'm still a Menace. Hehe.",
                "RULE 01: You have 20 minutes for 10 tasks.",
                "RULE 02: Tab switching results in a Progress Wipe.",
                "RULE 03: Success earns you Golden Keys.",
                "Cutscene ends. Ready to struggle? 🚀"
            ],

            init() {
                this.spawnStars();
                window.addEventListener('click', () => {
                    if (!this.state.isRunning) {
                        this.state.isRunning = true;
                        this.playRuleMovie();
                    }
                }, { once: true });
            },

            playRuleMovie() {
                if (this.state.ruleIdx < this.rules.length) {
                    this.type(this.rules[this.state.ruleIdx], () => {
                        setTimeout(() => {
                            if (this.state.isMovieMode) {
                                this.state.ruleIdx++;
                                this.playRuleMovie();
                            }
                        }, 2200);
                    });
                } else {
                    document.getElementById('modal-choice').classList.add('modal-show');
                }
            },

            // --- NAVIGATION LOGIC ONLY ---
            handleChoice(type) {
                document.getElementById('modal-choice').classList.remove('modal-show');
                if (type === 'READ') {
                    this.state.isMovieMode = false;
                    this.state.iq = 48;
                    this.updateIQ(0);
                    document.getElementById('prev-rule').style.display = 'block';
                    document.getElementById('next-rule').style.display = 'block';
                    this.state.ruleIdx = 0;
                    this.type(this.rules[0]);
                } else {
                    // This takes her to task1.html
                    localStorage.setItem('menace_iq', this.state.iq);
                    window.location.href = 'task1.html'; 
                }
            },

            navigate(dir) {
                this.state.ruleIdx = (this.state.ruleIdx + dir + this.rules.length) % this.rules.length;
                this.type(this.rules[this.state.ruleIdx]);
                if (this.state.ruleIdx === this.rules.length - 1) {
                    setTimeout(() => document.getElementById('modal-choice').classList.add('modal-show'), 1500);
                }
            },

            updateIQ(val) {
                this.state.iq += val;
                document.getElementById('iq-box').innerText = `IQ: ${this.state.iq}`;
            },

            type(txt, cb) {
                if(this.state.typingInt) clearInterval(this.state.typingInt);
                const el = document.getElementById('npc-text');
                el.innerHTML = ""; let i = 0;
                this.state.typingInt = setInterval(() => {
                    if (i < txt.length) { el.innerHTML += txt.charAt(i); i++; }
                    else { clearInterval(this.state.typingInt); if(cb) cb(); }
                }, 40);
            },

            spawnStars() {
                const layer = document.getElementById('twinkle-layer');
                for(let i=0; i<80; i++) {
                    const s = document.createElement('div');
                    s.style.cssText = `position:absolute; background:white; border-radius:50%; width:${Math.random()*4}px; height:${Math.random()*4}px; left:${Math.random()*100}vw; top:${Math.random()*100}vh; opacity:0.6; animation: starTwinklePulse 3s infinite ease-in-out;`;
                    layer.appendChild(s);
                }
            }
        };

        window.onload = () => Game.init();
    </script>
</body>
</html>
